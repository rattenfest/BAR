name: Typst Pipeline

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  determine-version:
    name: Determine document version
    runs-on: ubuntu-latest
    outputs:
      doc_version: ${{ steps.get_version.outputs.VERSION }}
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Filter for docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'

      - name: Calculate Document Version
        id: get_version
        run: |
          chmod +x .github/workflows/scripts/determine_documentversion.sh
          CALCULATED_VERSION=$(.github/workflows/scripts/determine_documentversion.sh "${{ github.ref_type }}" "${{ github.ref_name }}" "${{ github.event_name }}" "${{ github.event.pull_request.number }}")
          echo "Current Version: $CALCULATED_VERSION"
          echo "VERSION=$CALCULATED_VERSION" >> $GITHUB_OUTPUT

  build-document:
    needs: [lint-typst-files, determine-version]
    if: |
      always() &&
      (needs.determine-version.outputs.docs_changed == 'true' || 
       github.event_name == 'workflow_dispatch' || 
       github.ref_type == 'tag') &&
      needs.lint-typst-files.result != 'failure' &&
      needs.determine-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Current Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Build PDF
        run: typst compile --root . --input version="${{ needs.determine-version.outputs.doc_version }}" docs/main.typ docs/Dokumentation.pdf

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Documentation
          path: docs/Dokumentation.pdf

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.ref_type == 'tag'
        with:
          name: "${{ github.ref_name }}"
          files: docs/Dokumentation.pdf

  build-diff-document:
    needs:
      [build-document, lint-typst-files, determine-version]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || 
       github.ref_type == 'tag') &&
      needs.build-document.result != 'failure' &&
      needs.determine-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Current Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache typdiff
        id: cache-typdiff
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/typdiff
          key: ${{ runner.os }}-typdiff-v1

      - name: Install typdiff if not in Cache
        if: steps.cache-typdiff.outputs.cache-hit != 'true'
        run: cargo install typdiff

      - name: Prepare Diff
        run: |
          cp .github/workflows/scripts/flatten.py /tmp/flatten.py
          cp .github/workflows/scripts/prepare_diff.sh /tmp/prepare_diff.sh
          cp .github/workflows/scripts/clean_links.py /tmp/clean_links.py

          chmod +x /tmp/prepare_diff.sh

          /tmp/prepare_diff.sh "${{ github.ref_type }}" "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Remove nonexistent links
        if: hashFiles('docs/diff.typ') != ''
        run: |
          python3 /tmp/clean_links.py docs/diff.typ

      - name: Setup Typst
        if: hashFiles('docs/diff.typ') != ''
        uses: typst-community/setup-typst@v5

      - name: Build PDF
        if: hashFiles('docs/diff.typ') != ''
        run: typst compile --root . --input version="${{ needs.determine-version.outputs.doc_version }}" docs/diff.typ docs/Dokumentation_Changes.pdf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Dokumentation Changes
          path: docs/Dokumentation_Changes.pdf

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.ref_type == 'tag'
        with:
          name: "${{ github.ref_name }}"
          files: docs/Dokumentation_Changes.pdf

  commit-pdfs:
    needs: [build-document, build-diff-document, determine-version]
    if: |
      always() && 
      (github.event_name == 'workflow_dispatch' || 
       github.ref_type == 'tag') &&
      needs.build-document.result == 'success' && 
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download main PDF
        uses: actions/download-artifact@v4
        with:
          name: Dokumentation
          path: /tmp/pdfs

      - name: Download diff PDF
        if: needs.build-diff-document.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Dokumentation Changes
          path: /tmp/pdfs

      - name: Create PR with PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.ref_type }}" == "tag" ]; then
            TARGET_BRANCH="master"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          git fetch origin $TARGET_BRANCH
          git checkout $TARGET_BRANCH
          git pull origin $TARGET_BRANCH

          cp /tmp/pdfs/Dokumentation.pdf docs/Dokumentation.pdf
          if [ -f /tmp/pdfs/Dokumentation_Changes.pdf ]; then
            cp /tmp/pdfs/Dokumentation_Changes.pdf docs/Dokumentation_Changes.pdf
          fi

          git add docs/Dokumentation.pdf docs/Dokumentation_Changes.pdf 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0

          UPDATE_BRANCH="docs/update-pdf-$(date +%s)"
          git checkout -b "$UPDATE_BRANCH"
          git commit -m "docs: update PDFs" --no-verify
          git push origin "$UPDATE_BRANCH"

          GH_TOKEN=${{ secrets.BOT_APPROVAL_TOKEN }} gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "docs: update PDFs" \
            --body "Automated PDF update from the Typst pipeline."
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh pr review "$UPDATE_BRANCH" --approve
          gh pr merge "$UPDATE_BRANCH" --auto --squash --delete-branch

    lint-typst-files:
    name: Lint Typst Files
    needs: [determine-version]
    if: |
      always() &&
      (needs.determine-version.outputs.docs_changed == 'true' || 
       github.event_name == 'workflow_dispatch' || 
       github.ref_type == 'tag') &&
      needs.determine-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Current Code
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Setup Reviewdog
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: reviewdog/action-setup@v1

      - name: Run Figure Check and Comment
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail # Make result fail if something fails
          python .github/workflows/scripts/check_figures.py | reviewdog -name="Typst-Linter" -reporter=github-pr-review -filter-mode=nofilter -efm="%f:%l:%c: %m" -level=error -fail-on-error=true
